name: Deploy para VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build do frontend
        run: npm run build

      - name: Preparar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Empacotar e enviar para a VPS
        env:
          SSHOPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          tar czf /tmp/deploy.tar.gz base44 server dist
          scp $SSHOPTS /tmp/deploy.tar.gz "$TARGET:/tmp/deploy.tar.gz"

      - name: Aplicar, rebuildar e verificar na VPS
        env:
          SSHOPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          ssh $SSHOPTS "$TARGET" "bash -s" <<EOF
            set -e
            cd "$VPS_PATH"
            rm -rf base44 dist
            tar xzf /tmp/deploy.tar.gz -C "$VPS_PATH"
            test -f dist/index.html
            rm -f .dockerignore
            docker compose -f server/docker-compose.yml up -d --build app
            echo '--- aguardando backend ficar pronto ---'
            ready=0
            for attempt in \$(seq 1 30); do
              if curl -sf http://localhost:8000/health >/dev/null; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "\$ready" -ne 1 ]; then
              docker compose -f server/docker-compose.yml logs --tail=120 app
              exit 1
            fi
            curl -sf http://localhost:8000/health && echo ' — deploy OK'

            echo '--- autocorreção diária dos relatórios ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const response = await fetch("http://127.0.0.1:8000/functions/ensureDailyReportsCurrent", {
                method: "POST", headers: { "content-type": "application/json", "x-api-token": token },
                body: JSON.stringify({ _service_role: true })
              });
              const data = await response.json().catch(() => ({}));
              const detail = Array.isArray(data.details) ? data.details[0] : {};
              console.log("REPORT_SELF_HEAL_HTTP=" + response.status + "|OK=" + data.ok + "|TARGET=" + (data.target_date || "unknown") + "|TRIGGERED=" + (data.triggered_count ?? 0) + "|CORE=" + (detail?.completion_percent ?? 0) + "|EXTENDED=" + (detail?.extended_completion_percent ?? 0));
            ' </dev/null

            echo '--- aferição econômica e relatório semanal móvel ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const headers = { "content-type": "application/json", "x-api-token": token };
              const assessmentResponse = await fetch("http://127.0.0.1:8000/functions/runDailyEconomicAssessment", {
                method: "POST", headers,
                body: JSON.stringify({ _service_role: true, force: true })
              });
              const assessment = await assessmentResponse.json().catch(() => ({}));
              console.log("ECONOMIC_ASSESSMENT_HTTP=" + assessmentResponse.status + "|OK=" + assessment.ok + "|DATE=" + (assessment.assessment_date || "unknown") + "|PRODUCTS=" + (assessment.products_assessed ?? assessment.records_processed ?? 0));
              if (!assessmentResponse.ok || assessment.ok === false) throw new Error(assessment.error || "daily economic assessment failed");

              const weeklyResponse = await fetch("http://127.0.0.1:8000/functions/runWeeklyAdsPerformanceReport", {
                method: "POST", headers,
                body: JSON.stringify({ _service_role: true, force: true })
              });
              const weekly = await weeklyResponse.json().catch(() => ({}));
              console.log("WEEKLY_REPORT_HTTP=" + weeklyResponse.status + "|OK=" + weekly.ok + "|START=" + (weekly.week_start || "unknown") + "|END=" + (weekly.week_end || "unknown") + "|COVERAGE=" + (weekly.data_coverage_percent ?? 0) + "|PRODUCTS=" + (weekly.products_analyzed ?? 0));
              if (!weeklyResponse.ok || weekly.ok === false) throw new Error(weekly.error || "weekly report failed");
            ' </dev/null

            echo '--- retroativo Campaign Factory e métricas horárias ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const headers = { "content-type": "application/json", "x-api-token": token };
              const call = async (name, payload = {}) => {
                const response = await fetch("http://127.0.0.1:8000/functions/" + name, {
                  method: "POST", headers,
                  body: JSON.stringify({ _service_role: true, ...payload })
                });
                const data = await response.json().catch(() => ({}));
                console.log(name.toUpperCase() + "_HTTP=" + response.status + "|OK=" + data.ok + "|DATA=" + JSON.stringify(data).slice(0, 2000));
                if (!response.ok || data.ok === false) throw new Error(data.error || (name + " failed"));
                return data;
              };
              const callOptional = async (name, payload = {}) => {
                try {
                  return await call(name, payload);
                } catch (error) {
                  console.log(name.toUpperCase() + "_OPTIONAL_ERROR=" + String(error?.message || error));
                  return null;
                }
              };
              await call("syncFinanceEventsFromSpApi");
              await call("updateTermBankFromAutomaticCampaigns");
              await call("runCampaignFactory");
              await call("scheduleWeeklyCampaignFactoryLaunches", { max_campaigns: 10, trigger_type: "deploy_initial_rule_activation" });
              await callOptional("monitorZeroSalesReactivation");
              await callOptional("runMotorImediato", { force: false });
              await callOptional("syncUnifiedAdsReportsHourly", { days: 14, force: true });
              await call("rebuildHourlyMetricsFromReports", { full: true, lookback_days: 30 });
              await call("runCanonicalDaypartingEngine", { trigger: "deploy_retroactive_hourly_rebuild" });
            ' </dev/null

            echo '--- proteção econômica por SKU ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const response = await fetch("http://127.0.0.1:8000/functions/enforceSkuProfitProtection", {
                method: "POST", headers: { "content-type": "application/json", "x-api-token": token },
                body: JSON.stringify({ _service_role: true })
              });
              const data = await response.json().catch(() => ({}));
              const actions = (data.results || []).flatMap((row) => row.actions || []);
              console.log("SKU_PROTECTION_HTTP=" + response.status + "|OK=" + data.ok + "|ACTIONS=" + actions.length);
              for (const action of actions) console.log("SKU_ACTION=" + action.sku + "|" + action.action + "|" + (action.campaign_id || action.keyword_id || "unknown"));
              if (!response.ok || data.ok === false) console.log("SKU_PROTECTION_ERROR=" + (data.error || "unknown"));
            ' </dev/null

            echo '--- diagnostico de campanhas sem clique + resgate seguro de bid ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const targets = [
                { asin: "B0H59FPPKS", name: "SP | MANUAL | EXACT | B0H59FPPKS | lixeira sensor banheiro" },
                { asin: "B0GNW1Q6V3", name: "SP | MANUAL | EXACT | B0GNW1Q6V3 | headset gamer com fio usb" },
                { asin: "B0GNW1Q6V3", name: "SP | MANUAL | EXACT | B0GNW1Q6V3 | headset vermelho com microfone" },
                { asin: "B0GNY7NYRN", name: "SP | MANUAL | EXACT | B0GNY7NYRN | headset gamer 71 surround" },
                { asin: "B0GNY7NYRN", name: "SP | MANUAL | EXACT | B0GNY7NYRN | headset profissional azul usb fio 18m" },
                { asin: "B0FCYR3VBD", name: "SP | MANUAL | EXACT | B0FCYR3VBD | kit completo organizador bagagem viagem" },
                { asin: "B0H59FPPKS", name: "SP | MANUAL | EXACT | B0H59FPPKS | cesto de lixo para banheiro" },
                { asin: "B0H59FPPKS", name: "SP | MANUAL | EXACT | B0H59FPPKS | lixeira para banheiro" },
                { asin: "B0GNW1Q6V3", name: "SP | MANUAL | EXACT | B0GNW1Q6V3 | headset 71" },
                { asin: "B0GR6GXS1B", name: "SP | MANUAL | EXACT | B0GR6GXS1B | fechadura eletrônica biométrica wi-fi co" },
                { asin: "B0GR6GXS1B", name: "SP | MANUAL | EXACT | B0GR6GXS1B | fechadura eletronica digital" },
                { asin: "B0H59FPPKS", name: "SP | MANUAL | EXACT | B0H59FPPKS | lixeira antiodor bebe" }
              ];
              const repairResponse = await fetch("http://127.0.0.1:8000/functions/repairPriorityManualCampaigns", {
                method: "POST", headers: { "content-type": "application/json", "x-api-token": token },
                body: JSON.stringify({ _service_role: true, targets })
              });
              const repair = await repairResponse.json().catch(() => ({}));
              console.log("PRIORITY_REPAIR_HTTP=" + repairResponse.status + "|OK=" + repair.ok + "|CHECKED=" + (repair.checked || 0) + "|VERIFIED=" + (repair.verified || 0) + "|FAILED=" + (repair.failed || 0));
              for (const row of repair.results || []) {
                console.log("PRIORITY_REPAIR_ITEM=" + row.asin + "|" + row.campaign_name + "|" + row.status + "|" + (row.campaign_id || "") + "|" + (row.details?.error || ""));
              }

              const response = await fetch("http://127.0.0.1:8000/functions/runManualZeroDeliveryBootstrap", {
                method: "POST", headers: { "content-type": "application/json", "x-api-token": token },
                body: JSON.stringify({
                  _service_role: true,
                  target_asins: ["B0H59FPPKS", "B0GNW1Q6V3", "B0GNY7NYRN", "B0FCYR3VBD", "B0GR6GXS1B"],
                  max_age_days: 45
                })
              });
              const data = await response.json().catch(() => ({}));
              const rows = Array.isArray(data.results) ? data.results : [];
              const counts = {};
              for (const row of rows) {
                const key = row.action === "increase_bid"
                  ? (row.execution?.ok === false ? "bid_failed" : "bid_increased")
                  : (row.status || row.reason || "unchanged");
                counts[key] = (counts[key] || 0) + 1;
              }
              console.log("ZERO_DELIVERY_HTTP=" + response.status + "|OK=" + data.ok + "|CHECKED=" + rows.length + "|COUNTS=" + JSON.stringify(counts));
              console.log("ZERO_DELIVERY_STRUCTURE=" + JSON.stringify(data.structure_reports || []).slice(0, 6000));
              for (const row of rows.filter((r) => r.action === "increase_bid" || ["amazon_entity_not_enabled","out_of_stock","listing_ineligible","replacement_review_required","incomplete_structure"].includes(r.status))) {
                console.log("ZERO_DELIVERY_ITEM=" + (row.asin || "") + "|" + (row.campaign_name || row.campaign_id) + "|" + (row.keyword_text || row.keyword_id) + "|" + row.action + "|" + (row.status || row.reason || "") + "|" + (row.bid?.bid || ""));
              }
              if (!response.ok || data.ok === false) throw new Error(data.error || "zero delivery bootstrap failed");
            ' </dev/null

            echo '--- verificação do frontend publicado ---'
            printf 'APP_ASSET='
            curl -fsS http://127.0.0.1:8000/ | grep -oE 'assets/index-[^\" ]+\.js' | head -1 || true
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const base = Deno.env.get("APP_BASE_URL");
              if (!base) console.log("PUBLIC_ASSET=app_base_url_unset");
              else {
                try {
                  const html = await (await fetch(base)).text();
                  console.log("PUBLIC_ASSET=" + (html.match(/assets\/index-[^\" ]+\.js/)?.[0] || "not_found"));
                } catch { console.log("PUBLIC_ASSET=unreachable"); }
              }
            ' </dev/null

            printf 'SCHEDULER='
            docker compose -f server/docker-compose.yml exec -T app sh -lc 'echo \${ENABLE_SCHEDULER:-unset}' </dev/null
            docker compose -f server/docker-compose.yml exec -T db psql -U livingfinds -d livingfinds -Atc "select coalesce(data->>'end_date','sem_data'), coalesce(data->>'status','sem_status'), count(*) from amazon_ads_report_job group by 1,2 order by 1 desc,2 limit 12;" </dev/null || true
            docker compose -f server/docker-compose.yml exec -T db psql -U livingfinds -d livingfinds -Atc "select 'METRICS_MAX=' || coalesce(max(data->>'date'),'sem_data') || '|ROWS=' || count(*) from campaign_metrics_daily;" </dev/null || true
            docker compose -f server/docker-compose.yml exec -T db psql -U livingfinds -d livingfinds -Atc "select 'SKU_RULE_EXECUTIONS=' || count(*) from rule_execution where data->>'rule_key' in ('sku_profit_hard_pause','sku_daily_order_cap','sku_low_margin_bid_reduction');" </dev/null || true
          EOF
