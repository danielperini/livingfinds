name: Deploy para VPS

# Dispara a cada push na main. O runner do GitHub builda o frontend,
# envia server/, base44/ e dist/ para a VPS via SSH e rebuilda o container Docker.
# O Codex (ou qualquer um) só precisa dar push — a VPS atualiza sozinha.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions

concurrency:
  group: deploy-vps
  cancel-in-progress: false # não cancela um deploy no meio; enfileira

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build do frontend
        run: npm run build

      - name: Preparar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Empacotar e enviar para a VPS
        env:
          SSHOPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          # Empacota apenas os 3 diretórios que a VPS precisa. server/.env NÃO entra
          # no tar (não existe no repo) → segredos da VPS ficam preservados na extração.
          tar czf /tmp/deploy.tar.gz base44 server dist
          scp $SSHOPTS /tmp/deploy.tar.gz "$TARGET:/tmp/deploy.tar.gz"

      - name: Aplicar, rebuildar e verificar na VPS
        env:
          SSHOPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          ssh $SSHOPTS "$TARGET" "bash -s" <<EOF
            set -e
            cd "$VPS_PATH"
            # base44/ e dist/ não têm segredos → limpa para remover arquivos obsoletos.
            # server/ NÃO é apagado (contém o .env que não está no tar).
            rm -rf base44 dist
            tar xzf /tmp/deploy.tar.gz -C "$VPS_PATH"
            test -f dist/index.html
            # Remove resíduo de deploys antigos que excluía dist/ do contexto Docker.
            rm -f .dockerignore
            docker compose -f server/docker-compose.yml up -d --build app
            sleep 6
            curl -sf http://localhost:8000/health && echo ' — deploy OK'
          EOF
