name: Deploy para VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_post_deploy_amazon_automation:
        description: Executar rotinas Amazon mutáveis após o deploy
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build do frontend
        run: npm run build

      - name: Preparar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          test -n "${{ secrets.VPS_HOST }}"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "Aviso: ssh-keyscan não respondeu; seguindo com StrictHostKeyChecking=no."
            fi
            sleep 5
          done

      - name: Empacotar e enviar para a VPS
        env:
          SSHOPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          tar czf /tmp/deploy.tar.gz base44 server dist
          scp $SSHOPTS /tmp/deploy.tar.gz "$TARGET:/tmp/deploy.tar.gz"

      - name: Aplicar, rebuildar e verificar na VPS
        env:
          SSHOPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          RUN_POST_DEPLOY_AMAZON_AUTOMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.run_post_deploy_amazon_automation }}
        run: |
          ssh $SSHOPTS "$TARGET" "bash -s" <<EOF
            set -e
            cd "$VPS_PATH"
            rm -rf base44 dist
            tar xzf /tmp/deploy.tar.gz -C "$VPS_PATH"
            test -f dist/index.html
            rm -f .dockerignore
            if [ -n "${SCRAPINGBEE_API_KEY}" ]; then
              umask 077
              touch server/.env
              sed -i '/^SCRAPINGBEE_API_KEY=/d' server/.env
              printf '%s\n' 'SCRAPINGBEE_API_KEY=${SCRAPINGBEE_API_KEY}' >> server/.env
              echo 'SCRAPINGBEE_API_KEY sincronizada do GitHub Actions Secret'
            fi
            docker compose -f server/docker-compose.yml up -d --build app
            echo '--- aguardando backend ficar pronto ---'
            ready=0
            for attempt in \$(seq 1 30); do
              if curl -sf http://localhost:8000/health >/dev/null; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "\$ready" -ne 1 ]; then
              docker compose -f server/docker-compose.yml logs --tail=120 app
              exit 1
            fi
            curl -sf http://localhost:8000/health && echo ' — deploy OK'
            echo '--- verificando funções críticas carregadas ---'
            functions_json="\$(curl -fsS http://localhost:8000/functions)"
            echo "\$functions_json" | grep -q 'runAutomaticRepricing'
            echo "\$functions_json" | grep -q 'importProductEconomics'
            echo "\$functions_json" | grep -q 'enrollStockedProductsInRepricing'
            echo '--- validando ScrapingBee real dentro do container ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const key = Deno.env.get("SCRAPINGBEE_API_KEY") || "";
              if (!key) {
                console.log("::warning title=ScrapingBee::SCRAPINGBEE_API_KEY ausente; validacao externa ignorada");
                Deno.exit(0);
              }
              const params = new URLSearchParams({ query: "lixeira automatica sensor", domain: "com.br", pages: "1" });
              const response = await fetch("https://app.scrapingbee.com/api/v1/amazon/search?" + params, {
                headers: { Authorization: "Bearer " + key }, signal: AbortSignal.timeout(45000)
              });
              const payload = await response.json().catch(() => ({}));
              const count = Array.isArray(payload.products) ? payload.products.length : 0;
              console.log("SCRAPINGBEE_HTTP=" + response.status + "|PRODUCTS=" + count);
              if (!response.ok) {
                const detail = String(payload.message || payload.error || "sem detalhe").replace(/\r|\n/g, " ").slice(0, 240);
                console.log("::error title=ScrapingBee HTTP " + response.status + "::" + detail);
                throw new Error("ScrapingBee HTTP " + response.status);
              }
              if (count < 1) {
                console.log("::error title=ScrapingBee sem resultados::Amazon Search respondeu HTTP 200 mas products ficou vazio");
                throw new Error("ScrapingBee respondeu sem produtos para consulta de controle");
              }
            ' </dev/null
            echo 'FUNCTION_REGISTRY=runAutomaticRepricing,importProductEconomics — OK'

            echo '--- validar merchant e perfil Amazon Ads antes de qualquer mutacao ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const response = await fetch("http://127.0.0.1:8000/functions/validateAmazonAdsProfileIdentity", {
                method: "POST", headers: { "content-type": "application/json", "x-api-token": token },
                body: JSON.stringify({ _service_role: true, expected_seller_id: "A2K44HX7DX77LN" })
              });
              const data = await response.json().catch(() => ({}));
              console.log("ADS_PROFILE_IDENTITY_HTTP=" + response.status + "|OK=" + data.ok + "|SELLER=" + (data.expected_seller_id || "unknown") + "|PREVIOUS=" + (data.previous_profile_id || "none") + "|SELECTED=" + (data.selected_profile_id || "none") + "|CHANGED=" + (data.profile_changed ?? "unknown"));
              if (!response.ok || data.ok === false) throw new Error(data.error || "Perfil Amazon Ads nao corresponde ao merchant esperado");
            ' </dev/null

            echo '--- corrigir disponibilidade e inscrever SKUs estocados no repricing seguro ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const headers = { "content-type": "application/json", "x-api-token": token };
              const skus = ["FBA-0008P", "FBA-0008V", "FBA-0076A", "FBA-0076C", "FBA-0087b", "FBA-0087c", "FBA-0100", "SKU-002314A", "SKU-002314V", "W9-OL7U-LRW5"];
              const call = async (name, payload, allowLocked = false) => {
                const response = await fetch("http://127.0.0.1:8000/functions/" + name, {
                  method: "POST", headers, body: JSON.stringify({ _service_role: true, ...payload })
                });
                const data = await response.json().catch(() => ({}));
                console.log("REPRICING_" + name.toUpperCase() + "_HTTP=" + response.status + "|OK=" + data.ok + "|DATA=" + JSON.stringify(data).slice(0, 12000));
                const onlyLocked = Array.isArray(data.results) && data.results.length > 0 && data.results.every((row) => row.locked === true);
                if (!response.ok || (data.ok === false && !(allowLocked && onlyLocked))) throw new Error(data.error || (name + " failed"));
                if (allowLocked && onlyLocked) console.log("REPRICING_EVALUATION_DEFERRED=existing_cycle_lock|SAFE=true");
                return data;
              };
              await call("syncAmazonOfferAvailability", { skus, max_products: skus.length });
              const enrollment = await call("enrollStockedProductsInRepricing", { skus });
              const enrolled = (enrollment.results || []).reduce((sum, row) => sum + Number(row.enrolled || 0), 0);
              if (enrolled < skus.length) throw new Error("Nem todos os 10 SKUs estocados entraram na gestao: " + enrolled);
              await call("runAutomaticRepricing", {
                operation: "full_evaluation", recommendation_only: true,
                force_all_decisions: true, max_products: 200,
                changed_by: "deploy_stocked_sku_management"
              }, true);
            ' </dev/null

            echo '--- ativacao imediata de campanhas para SKUs com estoque confirmado ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const response = await fetch("http://127.0.0.1:8000/functions/ensureActiveProductCampaignCoverage", {
                method: "POST",
                headers: { "content-type": "application/json", "x-api-token": token },
                body: JSON.stringify({ _service_role: true, dry_run: false, fast_mode: true, require_actions: true, max_products: 25, run_harvest: false, trigger_type: "deploy_immediate_campaign_activation" })
              });
              const data = await response.json().catch(() => ({}));
              console.log("IMMEDIATE_CAMPAIGN_ACTIVATION_HTTP=" + response.status + "|OK=" + data.ok + "|FAILED=" + (data.failed ?? "unknown") + "|DATA=" + JSON.stringify(data).slice(0, 12000));
              if (!response.ok || data.ok === false) throw new Error(data.error || "immediate campaign activation failed");
            ' </dev/null

            echo '--- estrategia AUTO de baixo risco para produtos com vendas pequenas ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const response = await fetch("http://127.0.0.1:8000/functions/enforceLowVolumeProductAdsStrategy", {
                method: "POST",
                headers: { "content-type": "application/json", "x-api-token": token },
                body: JSON.stringify({ _service_role: true, dry_run: false, trigger_type: "deploy_low_volume_profit_guard" })
              });
              const data = await response.json().catch(() => ({}));
              console.log("LOW_VOLUME_ADS_HTTP=" + response.status + "|OK=" + data.ok + "|PROCESSED=" + (data.processed ?? 0) + "|ENABLED=" + (data.campaigns_enabled ?? 0) + "|BUDGETS_REDUCED=" + (data.budgets_reduced ?? 0) + "|BIDS_REDUCED=" + (data.bids_reduced ?? 0) + "|DATA=" + JSON.stringify(data.results || []).slice(0, 16000));
              if (!response.ok || data.ok === false) throw new Error(data.error || "low volume ads strategy failed");
            ' </dev/null

            if [ "${RUN_POST_DEPLOY_AMAZON_AUTOMATION}" = "true" ]; then
            echo '--- autocorreção diária dos relatórios ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const response = await fetch("http://127.0.0.1:8000/functions/ensureDailyReportsCurrent", {
                method: "POST", headers: { "content-type": "application/json", "x-api-token": token },
                body: JSON.stringify({ _service_role: true })
              });
              const data = await response.json().catch(() => ({}));
              const detail = Array.isArray(data.details) ? data.details[0] : {};
              console.log("REPORT_SELF_HEAL_HTTP=" + response.status + "|OK=" + data.ok + "|TARGET=" + (data.target_date || "unknown") + "|TRIGGERED=" + (data.triggered_count ?? 0) + "|CORE=" + (detail?.completion_percent ?? 0) + "|EXTENDED=" + (detail?.extended_completion_percent ?? 0));
            ' </dev/null

            echo '--- aferição econômica e relatório semanal móvel ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const headers = { "content-type": "application/json", "x-api-token": token };
              const assessmentResponse = await fetch("http://127.0.0.1:8000/functions/runDailyEconomicAssessment", {
                method: "POST", headers,
                body: JSON.stringify({ _service_role: true, force: true })
              });
              const assessment = await assessmentResponse.json().catch(() => ({}));
              console.log("ECONOMIC_ASSESSMENT_HTTP=" + assessmentResponse.status + "|OK=" + assessment.ok + "|DATE=" + (assessment.assessment_date || "unknown") + "|PRODUCTS=" + (assessment.products_assessed ?? assessment.records_processed ?? 0));
              if (!assessmentResponse.ok || assessment.ok === false) throw new Error(assessment.error || "daily economic assessment failed");

              const weeklyResponse = await fetch("http://127.0.0.1:8000/functions/runWeeklyAdsPerformanceReport", {
                method: "POST", headers,
                body: JSON.stringify({ _service_role: true, force: true })
              });
              const weekly = await weeklyResponse.json().catch(() => ({}));
              console.log("WEEKLY_REPORT_HTTP=" + weeklyResponse.status + "|OK=" + weekly.ok + "|START=" + (weekly.week_start || "unknown") + "|END=" + (weekly.week_end || "unknown") + "|COVERAGE=" + (weekly.data_coverage_percent ?? 0) + "|PRODUCTS=" + (weekly.products_analyzed ?? 0));
              if (!weeklyResponse.ok || weekly.ok === false) throw new Error(weekly.error || "weekly report failed");
            ' </dev/null

            echo '--- retroativo Campaign Factory e métricas horárias ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const headers = { "content-type": "application/json", "x-api-token": token };
              const call = async (name, payload = {}) => {
                const response = await fetch("http://127.0.0.1:8000/functions/" + name, {
                  method: "POST", headers,
                  body: JSON.stringify({ _service_role: true, ...payload })
                });
                const data = await response.json().catch(() => ({}));
                console.log(name.toUpperCase() + "_HTTP=" + response.status + "|OK=" + data.ok + "|DATA=" + JSON.stringify(data).slice(0, 2000));
                if (!response.ok || data.ok === false) throw new Error(data.error || (name + " failed"));
                return data;
              };
              const callOptional = async (name, payload = {}) => {
                try {
                  return await call(name, payload);
                } catch (error) {
                  console.log(name.toUpperCase() + "_OPTIONAL_ERROR=" + String(error?.message || error));
                  return null;
                }
              };
              await call("syncFinanceEventsFromSpApi");
              await call("updateTermBankFromAutomaticCampaigns");
              await call("runCampaignFactory");
              await call("scheduleWeeklyCampaignFactoryLaunches", { max_campaigns: 10, trigger_type: "deploy_initial_rule_activation" });
              await callOptional("monitorZeroSalesReactivation");
              await callOptional("runMotorImediato", { force: false });
              await callOptional("syncUnifiedAdsReportsHourly", { days: 14, force: true });
              await call("rebuildHourlyMetricsFromReports", { full: true, lookback_days: 30 });
              await call("runCanonicalDaypartingEngine", { trigger: "deploy_retroactive_hourly_rebuild" });
            ' </dev/null

            echo '--- proteção econômica por SKU ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const response = await fetch("http://127.0.0.1:8000/functions/enforceSkuProfitProtection", {
                method: "POST", headers: { "content-type": "application/json", "x-api-token": token },
                body: JSON.stringify({ _service_role: true })
              });
              const data = await response.json().catch(() => ({}));
              const actions = (data.results || []).flatMap((row) => row.actions || []);
              console.log("SKU_PROTECTION_HTTP=" + response.status + "|OK=" + data.ok + "|ACTIONS=" + actions.length);
              for (const action of actions) console.log("SKU_ACTION=" + action.sku + "|" + action.action + "|" + (action.campaign_id || action.keyword_id || "unknown"));
              if (!response.ok || data.ok === false) console.log("SKU_PROTECTION_ERROR=" + (data.error || "unknown"));
            ' </dev/null

            echo '--- diagnostico de campanhas sem clique + resgate seguro de bid ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const targets = [
                { asin: "B0H59FPPKS", name: "SP | MANUAL | EXACT | B0H59FPPKS | lixeira sensor banheiro" },
                { asin: "B0GNW1Q6V3", name: "SP | MANUAL | EXACT | B0GNW1Q6V3 | headset gamer com fio usb" },
                { asin: "B0GNW1Q6V3", name: "SP | MANUAL | EXACT | B0GNW1Q6V3 | headset vermelho com microfone" },
                { asin: "B0GNY7NYRN", name: "SP | MANUAL | EXACT | B0GNY7NYRN | headset gamer 71 surround" },
                { asin: "B0GNY7NYRN", name: "SP | MANUAL | EXACT | B0GNY7NYRN | headset profissional azul usb fio 18m" },
                { asin: "B0FCYR3VBD", name: "SP | MANUAL | EXACT | B0FCYR3VBD | kit completo organizador bagagem viagem" },
                { asin: "B0H59FPPKS", name: "SP | MANUAL | EXACT | B0H59FPPKS | cesto de lixo para banheiro" },
                { asin: "B0H59FPPKS", name: "SP | MANUAL | EXACT | B0H59FPPKS | lixeira para banheiro" },
                { asin: "B0GNW1Q6V3", name: "SP | MANUAL | EXACT | B0GNW1Q6V3 | headset 71" },
                { asin: "B0GR6GXS1B", name: "SP | MANUAL | EXACT | B0GR6GXS1B | fechadura eletrônica biométrica wi-fi co" },
                { asin: "B0GR6GXS1B", name: "SP | MANUAL | EXACT | B0GR6GXS1B | fechadura eletronica digital" },
                { asin: "B0H59FPPKS", name: "SP | MANUAL | EXACT | B0H59FPPKS | lixeira antiodor bebe" }
              ];
              const repairResponse = await fetch("http://127.0.0.1:8000/functions/repairPriorityManualCampaigns", {
                method: "POST", headers: { "content-type": "application/json", "x-api-token": token },
                body: JSON.stringify({ _service_role: true, targets })
              });
              const repair = await repairResponse.json().catch(() => ({}));
              console.log("PRIORITY_REPAIR_HTTP=" + repairResponse.status + "|OK=" + repair.ok + "|CHECKED=" + (repair.checked || 0) + "|VERIFIED=" + (repair.verified || 0) + "|FAILED=" + (repair.failed || 0));
              for (const row of repair.results || []) {
                console.log("PRIORITY_REPAIR_ITEM=" + row.asin + "|" + row.campaign_name + "|" + row.status + "|" + (row.campaign_id || "") + "|" + (row.details?.error || ""));
              }

              const response = await fetch("http://127.0.0.1:8000/functions/runManualZeroDeliveryBootstrap", {
                method: "POST", headers: { "content-type": "application/json", "x-api-token": token },
                body: JSON.stringify({
                  _service_role: true,
                  target_asins: ["B0H59FPPKS", "B0GNW1Q6V3", "B0GNY7NYRN", "B0FCYR3VBD", "B0GR6GXS1B"],
                  max_age_days: 45
                })
              });
              const data = await response.json().catch(() => ({}));
              const rows = Array.isArray(data.results) ? data.results : [];
              const counts = {};
              for (const row of rows) {
                const key = row.action === "increase_bid"
                  ? (row.execution?.ok === false ? "bid_failed" : "bid_increased")
                  : (row.status || row.reason || "unchanged");
                counts[key] = (counts[key] || 0) + 1;
              }
              console.log("ZERO_DELIVERY_HTTP=" + response.status + "|OK=" + data.ok + "|CHECKED=" + rows.length + "|COUNTS=" + JSON.stringify(counts));
              console.log("ZERO_DELIVERY_STRUCTURE=" + JSON.stringify(data.structure_reports || []).slice(0, 6000));
              for (const row of rows.filter((r) => r.action === "increase_bid" || ["amazon_entity_not_enabled","out_of_stock","listing_ineligible","replacement_review_required","incomplete_structure"].includes(r.status))) {
                console.log("ZERO_DELIVERY_ITEM=" + (row.asin || "") + "|" + (row.campaign_name || row.campaign_id) + "|" + (row.keyword_text || row.keyword_id) + "|" + row.action + "|" + (row.status || row.reason || "") + "|" + (row.bid?.bid || ""));
              }
              if (!response.ok || data.ok === false) throw new Error(data.error || "zero delivery bootstrap failed");
            ' </dev/null

            else
              echo '--- rotinas Amazon pós-deploy ignoradas; exigem workflow_dispatch explícito ---'
            fi

            echo '--- trava remota: reduzir bids inflacionados acima de R$1,00 ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const response = await fetch("http://127.0.0.1:8000/functions/bulkSetAllBids", {
                method: "POST", headers: { "content-type": "application/json", "x-api-token": token },
                body: JSON.stringify({ _service_role: true, bid: 1 })
              });
              const data = await response.json().catch(() => ({}));
              console.log("BID_CEILING_HTTP=" + response.status + "|OK=" + data.ok + "|KEYWORDS=" + JSON.stringify(data.keywords || {}) + "|WINNER_EXCEPTIONS=" + JSON.stringify(data.winner_keyword_exceptions || {}) + "|AD_GROUPS=" + JSON.stringify(data.ad_groups || {}) + "|TARGETS=" + JSON.stringify(data.targets || {}));
              if (!response.ok || data.ok === false) throw new Error("Falha ao limitar bids: " + JSON.stringify(data).slice(0, 3000));
            ' </dev/null

            echo '--- motor intradiario: agir agora sobre gasto acelerado por termo ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const response = await fetch("http://127.0.0.1:8000/functions/enforceSkuProfitProtection", {
                method: "POST", headers: { "content-type": "application/json", "x-api-token": token },
                body: JSON.stringify({ _service_role: true, dry_run: false, trigger_type: "deploy_immediate_intraday_bid_guard" })
              });
              const data = await response.json().catch(() => ({}));
              const summaries = (data.results || []).map((row) => row.summary || {});
              console.log("INTRADAY_BID_GUARD_HTTP=" + response.status + "|OK=" + data.ok + "|POLICY=" + data.policy_version + "|SUMMARIES=" + JSON.stringify(summaries));
              if (!response.ok || data.ok === false) throw new Error("Falha no motor intradiario: " + JSON.stringify(data).slice(0, 3000));
            ' </dev/null

            echo '--- garantia FINAL remota: 1 AUTO + 5 MANUAIS por SKU elegivel ---'
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const response = await fetch("http://127.0.0.1:8000/functions/ensureSkuCampaignFloor", {
                method: "POST", headers: { "content-type": "application/json", "x-api-token": token },
                body: JSON.stringify({ _service_role: true, manual_floor: 5, trigger_type: "deploy_clear_locks_and_restore_floor" })
              });
              const data = await response.json().catch(() => ({}));
              console.log("SKU_CAMPAIGN_RESTORE_HTTP=" + response.status + "|OK=" + data.ok + "|DEFICITS=" + (data.deficits_count ?? "unknown"));
              if (!response.ok || data.ok === false) throw new Error("Falha ao restaurar piso: " + JSON.stringify(data.deficits || []).slice(0, 5000));
            ' </dev/null
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
              const response = await fetch("http://127.0.0.1:8000/functions/verifyRemoteSkuCampaignFloor", {
                method: "POST",
                headers: { "content-type": "application/json", "x-api-token": token },
                body: JSON.stringify({ _service_role: true, manual_floor: 5 })
              });
              const data = await response.json().catch(() => ({}));
              console.log("SKU_CAMPAIGN_FLOOR_HTTP=" + response.status + "|OK=" + data.ok + "|PRODUCTS=" + (data.products ?? 0) + "|COMPLIANT=" + (data.compliant ?? 0) + "|DEFICITS=" + (data.deficits_count ?? "unknown") + "|DATA=" + JSON.stringify(data).slice(0, 20000));
              if (!response.ok || data.ok === false) throw new Error("Piso remoto 1 AUTO + 5 MANUAIS nao confirmado: " + JSON.stringify(data.deficits || []).slice(0, 5000));
            ' </dev/null

            echo '--- verificação do frontend publicado ---'
            printf 'APP_ASSET='
            curl -fsS http://127.0.0.1:8000/ | grep -oE 'assets/index-[^\" ]+\.js' | head -1 || true
            docker compose -f server/docker-compose.yml exec -T app deno eval '
              const base = Deno.env.get("APP_BASE_URL");
              if (!base) console.log("PUBLIC_ASSET=app_base_url_unset");
              else {
                try {
                  const html = await (await fetch(base)).text();
                  console.log("PUBLIC_ASSET=" + (html.match(/assets\/index-[^\" ]+\.js/)?.[0] || "not_found"));
                } catch { console.log("PUBLIC_ASSET=unreachable"); }
              }
            ' </dev/null

            printf 'SCHEDULER='
            docker compose -f server/docker-compose.yml exec -T app sh -lc 'echo \${ENABLE_SCHEDULER:-unset}' </dev/null
            docker compose -f server/docker-compose.yml exec -T db psql -U livingfinds -d livingfinds -Atc "select coalesce(data->>'end_date','sem_data'), coalesce(data->>'status','sem_status'), count(*) from amazon_ads_report_job group by 1,2 order by 1 desc,2 limit 12;" </dev/null || true
            docker compose -f server/docker-compose.yml exec -T db psql -U livingfinds -d livingfinds -Atc "select 'METRICS_MAX=' || coalesce(max(data->>'date'),'sem_data') || '|ROWS=' || count(*) from campaign_metrics_daily;" </dev/null || true
            docker compose -f server/docker-compose.yml exec -T db psql -U livingfinds -d livingfinds -Atc "select 'SKU_RULE_EXECUTIONS=' || count(*) from rule_execution where data->>'rule_key' in ('sku_profit_hard_pause','sku_daily_order_cap','sku_low_margin_bid_reduction');" </dev/null || true
          EOF
