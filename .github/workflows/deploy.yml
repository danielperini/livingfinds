name: Deploy para VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes de segurança da projeção
        run: node --test src/lib/profitProjectionMath.test.js src/lib/performanceSettingsNormalization.test.js scripts/deploy.test.mjs

      - name: Build do frontend
        run: npm run build

      - name: Preparar conexão SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          test -n "$VPS_HOST"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 5
          done

      - name: Empacotar e enviar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          SSHOPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=30
        run: |
          node scripts/scheduler-drain-locks.mjs > server/.scheduler-drain-locks.sql
          tar czf /tmp/deploy.tar.gz base44 server dist
          scp $SSHOPTS /tmp/deploy.tar.gz "$VPS_USER@$VPS_HOST:/tmp/deploy.tar.gz"

      - name: Backup, migrar e implantar sem executar rotinas comerciais
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          RELEASE_SHA: ${{ github.sha }}
          LIVE_BASE_URL: https://livingfinds.com.br
          SSHOPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=30
        run: |
          VPS_PATH_B64="$(printf '%s' "$VPS_PATH" | base64 -w0)"
          set -Eeuo pipefail
          remote_script="/tmp/livingfinds-deploy-$RELEASE_SHA.sh"
          scp $SSHOPTS scripts/deploy-vps.sh "$VPS_USER@$VPS_HOST:$remote_script"
          # A file avoids docker exec consuming the remainder of a bash -s heredoc.
          ssh $SSHOPTS "$VPS_USER@$VPS_HOST" "VPS_PATH_B64=$VPS_PATH_B64 RELEASE_SHA=$RELEASE_SHA bash $remote_script" </dev/null | tee /tmp/deploy-receipt.log
          node scripts/verify-deploy-receipt.mjs /tmp/deploy-receipt.log "$RELEASE_SHA"
          echo '--- verificando versão servida pelo domínio público ---'
          node scripts/verify-public-deploy.mjs
