name: Amazon data watchdog

on:
  schedule:
    # A cada duas horas; o watchdog só recupera dados ausentes/travados.
    - cron: '17 */2 * * *'
  workflow_dispatch:

concurrency:
  group: amazon-data-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar conexão segura à VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Recuperar relatórios e acionar o motor canônico
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 "$TARGET" "cd '$VPS_PATH' && docker compose -f server/docker-compose.yml exec -T app deno eval '
            const token = Deno.env.get(\"API_TOKEN\") || Deno.env.get(\"ADMIN_PASSWORD\") || \"\";
            const response = await fetch(\"http://127.0.0.1:8000/functions/checkAndForceReportPipeline\", {
              method: \"POST\",
              headers: { \"content-type\": \"application/json\", \"x-api-token\": token },
              body: JSON.stringify({ _service_role: true, trigger_type: \"scheduled_two_hour_data_watchdog\" }),
            });
            const data = await response.json().catch(() => ({}));
            console.log(\"WATCHDOG_HTTP=\" + response.status + \"|OK=\" + data.ok + \"|ACTION=\" + (data.action || \"unknown\") + \"|PIPELINE=\" + (data.pipeline_ok ?? \"n/a\"));
            if (!response.ok || data.ok === false) throw new Error(data.error || \"watchdog failed\");
          ' </dev/null"
