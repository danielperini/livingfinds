name: Proactive campaign growth cycle

on:
  schedule:
    # 07:15 and 15:15 America/Sao_Paulo (UTC-3). GitHub Actions cron is UTC.
    - cron: '15 10,18 * * *'
  workflow_dispatch:

concurrency:
  # Share the deploy lock so a scheduled write cycle cannot overlap a VPS restart.
  group: deploy-vps
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Prepare secure VPS connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run, monitor and reconcile durable motor executions
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 "$TARGET" "cd '$VPS_PATH' && docker compose -f server/docker-compose.yml exec -T app deno eval '
            const token = Deno.env.get(\"API_TOKEN\") || Deno.env.get(\"ADMIN_PASSWORD\") || \"\";
            const safeText = value => String(value ?? \"\").replace(/Bearer\\s+\\S+/gi, \"Bearer [redacted]\").replace(/Atza\\|[^\\s]+/gi, \"[redacted]\").replace(/(token|secret|password|authorization)\\s*[:=]\\s*[^,\\s\\\"]+/gi, \"$1=[redacted]\").slice(0, 300);
            const base = \"http://127.0.0.1:8000\";
            const headers = { \"content-type\": \"application/json\", \"x-api-token\": token };
            const post = async (path, payload) => {
              const response = await fetch(base + path, { method: \"POST\", headers, body: JSON.stringify(payload), signal: AbortSignal.timeout(15000) });
              const data = await response.json().catch(() => ({}));
              if (!response.ok) throw new Error(path + \" HTTP \" + response.status + \" \" + safeText(data.error || data.message));
              return data;
            };
            const startRun = async (functionName, requestKey, payload) => {
              const accepted = await post(\"/api/motor-runs\", { function_name: functionName, request_key: requestKey, account_id: payload.amazon_account_id || null, payload });
              if (!accepted.run_id) throw new Error(\"O endpoint durável não devolveu run_id.\");
              if (accepted.blocked_by_existing) {
                console.log(\"MOTOR_RUN_BLOCKED=\" + JSON.stringify({ run_id: accepted.run_id, status: accepted.status, reason: \"account_scope_has_unreconciled_run\" }));
                throw new Error(\"Execução bloqueada por run anterior ainda não reconciliado: \" + accepted.run_id + \" (\" + accepted.status + \"). Nenhuma nova tarefa foi iniciada.\");
              }
              console.log(\"MOTOR_RUN_ACCEPTED=\" + JSON.stringify({ run_id: accepted.run_id, status: accepted.status, reused: accepted.reused }));
              return accepted.run_id;
            };
            const waitRun = async runId => {
              const until = Date.now() + 25 * 60 * 1000;
              let lastProgress = \"\";
              while (Date.now() < until) {
                const response = await fetch(base + \"/api/motor-runs/\" + encodeURIComponent(runId), { headers, signal: AbortSignal.timeout(10000) });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.run) throw new Error(\"Consulta do run \" + runId + \" falhou: \" + safeText(data.error || response.status));
                const run = data.run;
                const progress = JSON.stringify({ status: run.status, stage: run.current_stage, last_activity_at: run.last_activity_at, remote_outcome: run.remote_outcome });
                if (progress !== lastProgress) { console.log(\"MOTOR_RUN_PROGRESS=\" + JSON.stringify({ run_id: runId, ...JSON.parse(progress) })); lastProgress = progress; }
                if ([\"completed\",\"partial\",\"failed\",\"interrupted\",\"remote_unknown\"].includes(run.status)) return run;
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
              throw new Error(\"Tempo de observação encerrado; execução continua consultável e não será reenviada: \" + runId);
            };
            const cycleId = \"proactive-growth-\" + new Date().toISOString().slice(0, 13);
            const common = { _service_role: true, _canonical_orchestrator: \"runUnifiedDecisionEngine\", correlation_id: cycleId, dry_run: false,
              force_campaign_lifecycle: true, serving_campaign_growth_target_pct: 40, max_new_exact_per_run: 10, max_auto_budget_expansions: 5,
              trigger_type: \"scheduled_twice_daily_proactive_growth\" };
            const engineRunId = await startRun(\"runUnifiedDecisionEngine\", cycleId + \"|engine\", common);
            const engineRun = await waitRun(engineRunId);
            console.log(\"MOTOR_RUN_FINAL=\" + JSON.stringify({ run_id: engineRun.id, status: engineRun.status, current_stage: engineRun.current_stage, summary: engineRun.result_summary, remote_outcome: engineRun.remote_outcome }));
            if ([\"interrupted\", \"remote_unknown\"].includes(engineRun.status)) throw new Error(\"Motor terminou com estado remoto incerto (\" + engineRun.status + \"); fila não será reenviada sem reconciliação.\");
            if ([\"partial\", \"failed\"].includes(engineRun.status)) console.log(\"MOTOR_ANALYSIS_WARNING=\" + JSON.stringify({ run_id: engineRun.id, status: engineRun.status, note: \"A fila ainda será drenada: cada decisão aprovada é revalidada individualmente pelo executor.\" }));
            const executionRunId = await startRun(\"executeApprovedDecisionQueue\", cycleId + \"|execute\", { _service_role: true, max_decisions: 50, trigger_type: \"scheduled_twice_daily_proactive_growth\" });
            const executionRun = await waitRun(executionRunId);
            console.log(\"MOTOR_EXECUTION_FINAL=\" + JSON.stringify({ run_id: executionRun.id, status: executionRun.status, summary: executionRun.result_summary, remote_outcome: executionRun.remote_outcome }));
            if ([\"interrupted\", \"remote_unknown\"].includes(executionRun.status) || executionRun.remote_outcome === \"unknown\") throw new Error(\"Resultado Amazon incerto: consultar e reconciliar o estado remoto antes de iniciar outro run.\");
            if (![\"completed\", \"partial\", \"failed\"].includes(executionRun.status)) throw new Error(\"Execução Amazon não confirmada: \" + executionRun.status + \", sem repetição automática.\");
            const confirmationRunId = await startRun(\"confirmExecutedDecisions\", cycleId + \"|confirm\", { _service_role: true, trigger_type: \"scheduled_twice_daily_proactive_growth\" });
            const confirmationRun = await waitRun(confirmationRunId);
            console.log(\"MOTOR_CONFIRMATION_FINAL=\" + JSON.stringify({ run_id: confirmationRun.id, status: confirmationRun.status, summary: confirmationRun.result_summary, remote_outcome: confirmationRun.remote_outcome }));
            if (confirmationRun.status !== \"completed\") throw new Error(\"Confirmação remota ficou incompleta; verificar cada ação antes de nova tentativa.\");
          ' </dev/null"
