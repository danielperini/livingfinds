name: Deploy main to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/livingfinds-${GITHUB_SHA}.tgz"
          tar --exclude=.git --exclude=node_modules -czf "$archive" -C "$GITHUB_WORKSPACE" .
          scp -P "${{ secrets.VPS_SSH_PORT || 22 }}" -i ~/.ssh/deploy_key "$archive" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/livingfinds-${GITHUB_SHA}.tgz"

      - name: Deploy and smoke test
        shell: bash
        env:
          VPS_PORT: ${{ secrets.VPS_SSH_PORT || 22 }}
          VPS_PATH: ${{ secrets.VPS_PATH || '/opt/livingfinds' }}
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "RELEASE_SHA='$GITHUB_SHA' VPS_PATH='$VPS_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          deploy="/opt/livingfinds-main-${RELEASE_SHA:0:12}"
          mkdir -p "$deploy"
          tar -xzf "/tmp/livingfinds-${RELEASE_SHA}.tgz" -C "$deploy"
          if [ -f "$VPS_PATH/server/.env" ]; then
            cp "$VPS_PATH/server/.env" "$deploy/server/.env"
          fi
          if [ -d "$VPS_PATH/dist" ] && [ ! -d "$deploy/dist" ]; then
            cp -a "$VPS_PATH/dist" "$deploy/dist"
          fi
          cd "$deploy"
          docker compose -p server -f server/docker-compose.yml down
          export LIVINGFINDS_RELEASE_SHA="$RELEASE_SHA"
          docker compose -p server -f server/docker-compose.yml up -d --build
          for i in $(seq 1 24); do
            status="$(docker inspect --format '{{.State.Health.Status}}' server-app-1 2>/dev/null || true)"
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' server-app-1)" = healthy
          curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null
          test "$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' server-app-1 | grep -F "LIVINGFINDS_RELEASE_SHA=$RELEASE_SHA")"
          docker image prune -f >/dev/null
          rm -f "/tmp/livingfinds-${RELEASE_SHA}.tgz"
          REMOTE
