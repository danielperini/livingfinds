name: Drain approved bid decisions

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: drain-approved-bid-decisions
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Enviar decisões aprovadas para a Amazon
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          for attempt in 1 2 3; do
            echo "Tentativa SSH $attempt/3 para drenar decisões de bid"
            if ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 -o StrictHostKeyChecking=no "$TARGET" "cd '$VPS_PATH' && docker compose -f server/docker-compose.yml exec -T app deno eval '
              const token = Deno.env.get(\"API_TOKEN\") || Deno.env.get(\"ADMIN_PASSWORD\") || \"\";
              const response = await fetch(\"http://127.0.0.1:8000/functions/drainApprovedBidDecisions\", {
                method: \"POST\",
                headers: { \"content-type\": \"application/json\", \"x-api-token\": token },
                body: JSON.stringify({ _service_role: true, trigger_type: \"scheduled_automatic_bid_drain\", lookback_hours: 72, max_execute: 20, scan_limit: 500 })
              });
              const data = await response.json().catch(() => ({}));
              console.log(\"BID_DRAIN_HTTP=\" + response.status
                + \"|OK=\" + data.ok
                + \"|STATUS_COUNTS=\" + JSON.stringify(data.status_counts || {})
                + \"|EXECUTABLE=\" + (data.scanned_executable ?? 0)
                + \"|CANONICAL=\" + (data.canonical_targets ?? 0)
                + \"|SUPERSEDED=\" + (data.superseded_duplicates ?? 0)
                + \"|SELECTED=\" + (data.selected ?? 0)
                + \"|AMAZON_MUTATIONS=\" + (data.amazon_mutations_sent ?? 0)
                + \"|FAILED=\" + (data.failed ?? 0)
                + \"|REMAINING=\" + (data.remaining_canonical ?? 0));
              console.log(\"BID_DRAIN_RESULTS=\" + JSON.stringify(data.results || []));
              if (!response.ok || data.ok === false) throw new Error(data.error || \"automatic bid drain failed\");
            ' </dev/null"; then
              exit 0
            fi
            sleep 20
          done
          echo "Falha de SSH após 3 tentativas ao drenar bids"
          exit 1
