name: Apply Sales Mode Fast Track one-shot

on:
  push:
    branches:
      - fast-track-origin-main-20260824-025651
    paths:
      - .github/workflows/apply-fast-track-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fast-track-origin-main-20260824-025651
          fetch-depth: 0

      - name: Apply deterministic Fast Track patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, name):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'PATCH NOT FOUND: {name}')
              p.write_text(s.replace(old, new, 1))
              print('OK', name)

          # canonicalDecisionPolicy.ts
          path = 'base44/shared/canonicalDecisionPolicy.ts'
          replace_once(path,
          """  const bounded = action === 'INCREASE' || action === 'RECOVER_ZERO_DELIVERY'\n    ? Math.min(0.05, Math.max(0, changePct))""",
          """  const bounded = action === 'INCREASE' || action === 'RECOVER_ZERO_DELIVERY'\n    ? Math.min(0.15, Math.max(0, changePct))""",
          'increase cap 15%')
          replace_once(path,
          """    if (bounded > 0 && actual > 0.05) proposedBid = Math.floor(input.currentBid * 1.05 * 100) / 100;""",
          """    if (bounded > 0 && actual > 0.15) proposedBid = Math.floor(input.currentBid * 1.15 * 100) / 100;""",
          'actual cap 15%')
          replace_once(path,
          """  if (winnerWithinEconomicGuardrail) return bidResult(input, posterior, 'HOLD', 0, 'WINNER_PROTECTED', 'Venda same-SKU lucrativa e dentro da meta protege a entidade até a próxima janela.', 99, 12);""",
          """  // SALES_MODE_FAST_TRACK: winnerProtected protege contra pausa, nao congela crescimento.\n  if (winnerWithinEconomicGuardrail) {\n    if (input.currentBid >= input.safeMaxCpc) {\n      return bidResult(input, posterior, 'HOLD', 0, 'WINNER_AT_SAFE_CPC', 'Vencedor protegido, mas o bid ja atingiu o CPC economico seguro.', 99, 6);\n    }\n    const target = Number(input.targetAcos || 0);\n    const acos = Number(input.acos || 0);\n    const veryStrongWinner = input.sameSkuOrders >= 3 && target > 0 && acos > 0 && acos <= target * 0.75 && input.profitAfterAds > 0;\n    const strongWinner = input.sameSkuOrders >= 2 && input.profitAfterAds > 0;\n    const pct = veryStrongWinner ? 0.15 : strongWinner ? 0.10 : 0.05;\n    return bidResult(\n      input, posterior, 'INCREASE', pct,\n      veryStrongWinner ? 'FAST_TRACK_VERY_STRONG_WINNER' : strongWinner ? 'FAST_TRACK_STRONG_WINNER' : 'FAST_TRACK_WINNER',\n      `Vencedor same-SKU lucrativo: crescimento controlado de ${Math.round(pct * 100)}% limitado pelo CPC economico.`,\n      veryStrongWinner ? 97 : strongWinner ? 95 : 92,\n      veryStrongWinner ? 3 : strongWinner ? 4 : 6\n    );\n  }""",
          'winner growth')
          replace_once(path,
          """  if (input.ageHours < 48) return bidResult(input, posterior, 'HOLD', 0, 'INITIAL_OBSERVATION_48H', 'Primeiras 48 horas reservadas para observação; somente risco financeiro crítico pode usar rota defensiva separada.', 98, 48);""",
          """  // SALES_MODE_FAST_TRACK: zero delivery pode recuperar antes de 48h com estrutura, estoque e economia confirmados.\n  if (input.ageHours < 48 && input.impressions <= 0 && input.clicks <= 0 && input.structurallyComplete && input.adGroupConfirmed && input.productAdConfirmed && input.inStock && input.economicsComplete && input.safeMaxCpc > input.currentBid && !input.cooldownActive && !input.pendingInsertion) {\n    const pct = input.ageHours >= 12 ? 0.10 : 0.05;\n    return bidResult(input, posterior, 'RECOVER_ZERO_DELIVERY', pct, 'FAST_TRACK_NEW_ZERO_DELIVERY', `Campanha nova estruturalmente valida e sem impressoes: recuperacao controlada de ${Math.round(pct * 100)}%.`, 94, input.ageHours >= 12 ? 4 : 6);\n  }\n  if (input.ageHours < 48) return bidResult(input, posterior, 'HOLD', 0, 'INITIAL_OBSERVATION_48H', 'Primeiras 48 horas preservam observacao quando ja existe entrega ou falta evidencia para fast track.', 98, 12);""",
          'new zero delivery fast track')
          replace_once(path,
          """  return bidResult(input, posterior, 'INCREASE', 0.03, 'PROFITABLE_GROWTH_TEST', 'Venda same-SKU lucrativa permite teste de crescimento de 3% dentro do CPC seguro.', 90, 24);""",
          """  return bidResult(input, posterior, 'INCREASE', 0.05, 'PROFITABLE_GROWTH_TEST', 'Venda same-SKU lucrativa permite crescimento de 5% dentro do CPC economico seguro.', 92, 6);""",
          'profitable growth 5%')

          # test
          replace_once('base44/shared/canonicalDecisionPolicy.test.ts',
          "assert.ok(zeroDelivery.changePct > 0 && zeroDelivery.changePct <= 0.05);",
          "assert.ok(zeroDelivery.changePct > 0 && zeroDelivery.changePct <= 0.15);",
          'test max 15%')

          # executor
          path = 'base44/functions/executeApprovedDecisionQueue/entry.ts'
          replace_once(path, 'const MAX_BATCH = 12;', 'const MAX_BATCH = 25;', 'batch 25')
          replace_once(path, 'const EXECUTION_DEADLINE_MS = 75_000;', 'const EXECUTION_DEADLINE_MS = 110_000;', 'deadline 110s')

          anchor = """function present(...values: any[]) {\n  return values.find((value) => value !== undefined && value !== null);\n}\n"""
          helpers = anchor + """\nconst RECOVERABLE_GOVERNANCE_BLOCKERS = new Set([\n  'STALE_DATA','ADS_DATA_STALE','SP_API_DATA_STALE','ECONOMICS_DATA_STALE','ECONOMICS_INCOMPLETE',\n  'STRUCTURE_INCOMPLETE','COOLDOWN_ACTIVE','COMPETITION_STALE','PREDICTION_CONFIDENCE',\n  'ECONOMIC_CONFIDENCE','SNAPSHOT_REQUIRED','SNAPSHOT_MISSING','LOW_ECONOMIC_CONFIDENCE'\n]);\nconst HARD_GOVERNANCE_BLOCKERS = new Set([\n  'ACCOUNT_KILL_SWITCH','ACCOUNT_DAILY_CAP','OUT_OF_STOCK','NOT_BUYABLE','PRODUCT_NOT_ELIGIBLE',\n  'LISTING_INACTIVE','OFFER_INACTIVE','SAFE_CPC_CEILING','SAFE_CPC_EXCEEDED','ECONOMIC_CEILING',\n  'MARGIN_FLOOR','PARENT_ASIN'\n]);\nfunction governanceRetryMinutes(codes: string[], attempt: number): number {\n  if (codes.includes('COOLDOWN_ACTIVE')) return 180;\n  if (codes.some((c) => c.includes('STRUCTURE'))) return 10;\n  if (codes.some((c) => c.includes('ECONOM'))) return 15;\n  if (codes.some((c) => c.includes('STALE'))) return 10;\n  return Math.min(60, 5 * Math.max(1, 2 ** Math.min(attempt, 3)));\n}\n"""
          replace_once(path, anchor, helpers, 'governance helpers')

          old = """          if (!governance.allowed) {\n            await base44.asServiceRole.entities.OptimizationDecision.update(decision.id, {\n              status: 'blocked',\n              queue_status: 'completed',\n              error_message: `GOVERNANCE_BLOCK: ${governance.blockers.map((blocker) => blocker.code).join(',')}`.slice(0, 500),\n            }).catch(() => {});\n            results.push({ id: decision.id, action: decision.action, ok: false, skipped: true, governance });\n            skipped++;\n            continue;\n          }"""
          new = """          if (!governance.allowed) {\n            const codes = governance.blockers.map((blocker) => String(blocker.code || '').toUpperCase());\n            const hasHardBlocker = codes.some((code) => HARD_GOVERNANCE_BLOCKERS.has(code));\n            const recoverable = !hasHardBlocker && codes.some((code) => RECOVERABLE_GOVERNANCE_BLOCKERS.has(code) || code.includes('STALE') || code.includes('INCOMPLETE') || code.includes('COOLDOWN'));\n            if (recoverable) {\n              const retryMinutes = governanceRetryMinutes(codes, Number(decision.attempt_count || 0));\n              await base44.asServiceRole.entities.OptimizationDecision.update(decision.id, {\n                status: 'waiting_retry', queue_status: 'scheduled',\n                next_retry_at: new Date(Date.now() + retryMinutes * 60000).toISOString(),\n                error_message: `FAST_TRACK_WAITING_REFRESH: ${codes.join(',')} | retry=${retryMinutes}m`.slice(0, 500),\n              }).catch(() => {});\n              results.push({ id: decision.id, action: decision.action, ok: false, scheduled: true, fast_track: true, reason: 'WAITING_REFRESH', retry_minutes: retryMinutes, governance });\n              skipped++;\n              continue;\n            }\n            await base44.asServiceRole.entities.OptimizationDecision.update(decision.id, {\n              status: 'blocked', queue_status: 'completed',\n              error_message: `GOVERNANCE_HARD_BLOCK: ${codes.join(',')}`.slice(0, 500),\n            }).catch(() => {});\n            results.push({ id: decision.id, action: decision.action, ok: false, skipped: true, hard_block: true, governance });\n            skipped++;\n            continue;\n          }"""
          replace_once(path, old, new, 'recoverable governance')

          marker = """          const protectiveBidReduction = String(decision.action || '').toLowerCase().includes('reduce') &&"""
          dedup = """          const awaitingAmazonConfirmation = priorEntityDecisions.some((prior: any) => {\n            if (String(prior.id || '') === String(decision.id || '')) return false;\n            const pendingConfirmation = ['pending', 'propagating'].includes(String(prior.confirmation_status || '').toLowerCase()) || ['confirming', 'awaiting_confirmation'].includes(String(prior.status || '').toLowerCase());\n            if (!pendingConfirmation) return false;\n            const ts = new Date(String(prior.executed_at || prior.last_attempt_at || prior.updated_at || prior.created_at || 0)).getTime();\n            return Number.isFinite(ts) && ts >= Date.now() - 2 * 3600000;\n          });\n          if (awaitingAmazonConfirmation) {\n            await base44.asServiceRole.entities.OptimizationDecision.update(decision.id, {\n              status: 'waiting_retry', queue_status: 'scheduled', next_retry_at: new Date(Date.now() + 10 * 60000).toISOString(),\n              error_message: 'AWAITING_AMAZON_CONFIRMATION: existe escrita recente da mesma entidade aguardando propagacao.',\n            }).catch(() => {});\n            results.push({ id: decision.id, action: decision.action, ok: false, scheduled: true, reason: 'AWAITING_AMAZON_CONFIRMATION' });\n            skipped++;\n            continue;\n          }\n\n""" + marker
          replace_once(path, marker, dedup, 'confirmation dedup')

          old = """          if (ok && capability.definition?.confirmationRequired) {\n            await base44.asServiceRole.entities.OptimizationDecision.update(decision.id, {\n              confirmation_status: 'pending',\n              confirmation_error: null,\n              confirmed_at: null,\n            }).catch(() => {});\n          }"""
          new = """          if (ok && capability.definition?.confirmationRequired) {\n            await base44.asServiceRole.entities.OptimizationDecision.update(decision.id, {\n              status: 'confirming', queue_status: 'completed', confirmation_status: 'propagating',\n              confirmation_error: null, confirmed_at: null, last_attempt_at: new Date().toISOString(),\n            }).catch(() => {});\n          }"""
          replace_once(path, old, new, 'confirmation state')

          # confirmExecutedDecisions
          path = 'base44/functions/confirmExecutedDecisions/entry.ts'
          p = Path(path); s = p.read_text(); s = s.replace(', null, 1)', ', undefined, 1)'); p.write_text(s)
          old = """function confirmationFailureState(decision: any) {\n  const ambiguous = ['confirming', 'conflict_reconciling'].includes(String(decision.status || ''));\n  const canRetry = Number(decision.attempt_count || 0) < Number(decision.max_attempts || 3);\n  if (ambiguous && canRetry) {\n    return {\n      status: 'waiting_retry',\n      queue_status: 'scheduled',\n      next_retry_at: new Date(Date.now() + 5 * 60000).toISOString(),\n    };\n  }\n  return { status: ambiguous ? 'failed_final' : 'failed', queue_status: 'failed' };\n}"""
          new = """function confirmationFailureState(decision: any) {\n  const ambiguous = ['confirming', 'awaiting_confirmation', 'conflict_reconciling'].includes(String(decision.status || ''));\n  const confirmationAttempts = Number(decision.confirmation_attempt_count || 0);\n  const maxConfirmationAttempts = Math.max(3, Number(decision.max_confirmation_attempts || 6));\n  if (ambiguous && confirmationAttempts < maxConfirmationAttempts) {\n    return { status: 'confirming', queue_status: 'completed', confirmation_status: 'propagating', confirmation_attempt_count: confirmationAttempts + 1, last_attempt_at: new Date().toISOString() };\n  }\n  return { status: ambiguous ? 'failed_final' : 'failed', queue_status: 'failed', confirmation_attempt_count: confirmationAttempts + 1 };\n}"""
          replace_once(path, old, new, 'confirmation retry is probe-only')
          old = """    ]);\n    const executed = [...executedRows, ...confirmingRows, ...conflictRows];"""
          new = """    ]);\n    const awaitingRows = await base44.asServiceRole.entities.OptimizationDecision.filter(\n      { amazon_account_id: aid, status: 'awaiting_confirmation' }, '-last_attempt_at', 100\n    ).catch(() => []);\n    const executed = [...executedRows, ...confirmingRows, ...conflictRows, ...awaitingRows];"""
          replace_once(path, old, new, 'include awaiting_confirmation')
          PY

      - name: Validate Fast Track modules
        run: |
          deno check --node-modules-dir=auto \
            base44/shared/canonicalDecisionPolicy.ts \
            base44/functions/executeApprovedDecisionQueue/entry.ts \
            base44/functions/confirmExecutedDecisions/entry.ts
          deno test --node-modules-dir=auto \
            base44/shared/canonicalDecisionPolicy.test.ts \
            base44/shared/amazonBidCeiling.test.ts \
            base44/shared/configuredBidPolicy.test.ts \
            base44/shared/economicEvidencePolicy.test.ts \
            base44/shared/portfolioBudgetPacing.test.ts \
            base44/shared/searchTermHarvestPolicy.test.ts \
            base44/shared/servingCampaignGrowthPolicy.test.ts

      - name: Commit Fast Track patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            base44/shared/canonicalDecisionPolicy.ts \
            base44/shared/canonicalDecisionPolicy.test.ts \
            base44/functions/executeApprovedDecisionQueue/entry.ts \
            base44/functions/confirmExecutedDecisions/entry.ts
          git diff --cached --check
          git commit -m "feat: add Sales Mode fast-track confirmation flow"
          git push origin HEAD:fast-track-origin-main-20260824-025651
