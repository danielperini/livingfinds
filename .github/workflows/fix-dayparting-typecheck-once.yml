name: Fix dayparting typecheck once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dayparting-typecheck-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply type-only fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('base44/functions/runCanonicalDaypartingEngine/entry.ts'),
              Path('base44/functions/runWeekendHolidayDaypartLearning/entry.ts'),
              Path('base44/functions/syncDaypartingConfiguration/entry.ts'),
          ]
          for path in paths:
              text = path.read_text()
              text = text.replace(', null, ', ', undefined, ')
              if path.name == 'entry.ts' and 'syncDaypartingConfiguration' in str(path):
                  text = text.replace('const CANONICAL_RULES = [];', 'const CANONICAL_RULES: any[] = [];')
              path.write_text(text)
          PY
      - name: Validate exact dayparting modules
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          export PATH="$HOME/.deno/bin:$PATH"
          deno check --node-modules-dir=auto \
            base44/functions/runCanonicalDaypartingEngine/entry.ts \
            base44/functions/runWeekendHolidayDaypartLearning/entry.ts \
            base44/functions/syncDaypartingConfiguration/entry.ts
      - name: Commit fixes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-dayparting-typecheck-once.yml
          git add base44/functions/runCanonicalDaypartingEngine/entry.ts \
                  base44/functions/runWeekendHolidayDaypartLearning/entry.ts \
                  base44/functions/syncDaypartingConfiguration/entry.ts
          git commit -m "fix: typecheck canonical dayparting"
          git push origin HEAD:main
