name: Validate decision engine

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Canonical Amazon decision/dayparting stack is validated on every main push.
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test deployment transport and release receipt
        run: node --test scripts/deploy.test.mjs
      - name: Test performance settings normalization
        run: node --test src/lib/performanceSettingsNormalization.test.js
      - name: Test Amazon confirmation labels
        run: node --test src/lib/motorLabels.test.js
      - name: Test daily motor status messaging
        run: node --test src/lib/dailyMotorStatus.test.js
      - name: Test read-only motor dashboard paging, history and refresh
        run: node --test src/lib/motorDashboardRead.test.js src/lib/operationalDashboard.test.mjs base44/shared/operationalState.test.js
      - name: Test daily growth cycle recovery contract
        run: node --test src/lib/proactiveGrowthCycle.test.js
      - name: Test post-deploy Amazon workflow isolation
        run: node --test src/lib/postDeployHooks.test.js
      - name: Test interface navigation, operational queue and overlay contracts
        run: node --test src/lib/navigation.test.js src/lib/operationalQueueHealth.test.js src/lib/pagination.test.js src/lib/toastPointerEvents.test.js src/lib/durableMotorExecution.test.js src/lib/proactiveGrowthCycle.test.js base44/shared/importedSearchTermReport.test.js base44/shared/searchTermQuality.test.js
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build

  pacing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Amazon Ads policy unit tests
        run: |
          deno test --node-modules-dir=auto \
            base44/shared/listingOfferStatus.test.ts \
            base44/shared/offerInventoryPolicy.test.ts \
            base44/shared/accountDailySpend.test.ts \
            base44/shared/campaignBudgetPolicy.test.ts \
            base44/shared/promotionConfirmation.test.ts \
            base44/shared/profitGuardPolicy.test.ts \
            base44/shared/adsUnitEconomics.test.ts \
            base44/shared/verifiedBidEvidence.test.ts \
            base44/shared/stockAdsPolicy.test.ts \
            base44/shared/campaignCoverageEligibility.test.ts \
            base44/shared/portfolioBudgetPacing.test.ts \
            base44/shared/campaignDeliveryHealthPolicy.test.ts \
            base44/shared/amazonBidCeiling.test.ts \
            base44/shared/configuredBidPolicy.test.ts \
            base44/shared/searchTermHarvestPolicy.test.ts \
            base44/shared/canonicalCyclePolicy.test.ts \
            base44/shared/servingCampaignGrowthPolicy.test.ts \
            base44/shared/economicEvidencePolicy.test.ts \
            base44/shared/v6siaFailurePolicy.test.ts \
            base44/shared/v6siaReviewEvidence.test.ts \
            base44/shared/v6siaEvidencePaging.test.ts \
            base44/shared/v6siaSnapshotScope.test.ts \
            base44/shared/emptyHarvestMemo.test.ts \
            base44/shared/searchTermHarvestEvidence.test.ts \
            base44/shared/v6siaLifecycle.e2e.test.ts \
            base44/shared/metricsToAmazonMutation.e2e.test.ts \
            base44/shared/autoCampaignRepairPolicy.test.ts \
            base44/shared/skuCampaignDistributionPolicy.test.ts \
            base44/shared/manualKickoffReactivationPolicy.test.ts \
            base44/shared/skuCampaignScope.test.ts \
            base44/shared/campaignMetricsIntegrity.test.ts \
            base44/shared/optimizationDecisionIdempotency.test.ts \
            base44/shared/economicBudgetBalancer.test.ts \
            base44/shared/dailyAdsReportOptimizationPolicy.test.ts
      - name: Check SKU campaign distribution enforcement
        run: |
          deno check --node-modules-dir=auto \
            base44/shared/skuCampaignDistributionPolicy.ts \
            base44/functions/runImmediateSameSkuSearchTermHarvest/entry.ts \
            base44/functions/runTermBankToCampaigns/entry.ts \
            base44/functions/ensureSkuCampaignFloor/entry.ts \
            base44/functions/verifyRemoteSkuCampaignFloor/entry.ts \
            base44/functions/expandCoverageForAsin/entry.ts
      - name: Check economic evidence policy
        run: deno check --node-modules-dir=auto base44/shared/economicEvidencePolicy.ts
      - name: Check economic evidence evaluator
        run: deno check --node-modules-dir=auto base44/functions/runEconomicEvidenceDecisionPolicy/entry.ts
      - name: Check evidence reconciliation
        run: deno check --node-modules-dir=auto base44/functions/reconcileEconomicEvidenceDecisions/entry.ts
      - name: Check canonical pre-execution arbiter
        run: deno check --node-modules-dir=auto base44/functions/arbitrateCanonicalDecisionConflicts/entry.ts
      - name: Check canonical decision cycle
        run: deno check --node-modules-dir=auto base44/functions/runCanonicalDecisionCycle/entry.ts
      - name: Check daily Amazon Ads report-driven optimization
        run: deno check --node-modules-dir=auto base44/shared/dailyAdsReportOptimizationPolicy.ts base44/functions/pollAmazonAdsReportJobs/entry.ts
      - name: Check daily motor watchdog and SKU E2E recovery
        run: deno check --node-modules-dir=auto base44/functions/runDailyMotorWatchdog/entry.ts server/src/scheduler.ts
      - name: Check automatic campaign repair queue guards
        run: deno check --node-modules-dir=auto base44/shared/autoCampaignRepairPolicy.ts base44/functions/processAutoCampaignRepairQueue/entry.ts base44/functions/processAutoCampaignRepairQueueV2/entry.ts base44/functions/repairIncompleteAutoCampaigns/entry.ts
      - name: Check V6SIA execution and supervision
        run: |
          deno check --node-modules-dir=auto \
            base44/shared/v6siaFailurePolicy.ts \
            base44/shared/v6siaReviewEvidence.ts \
            base44/shared/v6siaEvidencePaging.ts \
            base44/shared/v6siaLifecycle.ts \
            base44/functions/superviseV6SIA/entry.ts \
            base44/functions/executeApprovedDecisionQueue/entry.ts \
            base44/functions/executeAutopilotDecisionV2/entry.ts \
            base44/functions/confirmExecutedDecisions/entry.ts \
            base44/functions/reconcileAndRetryDecisions/entry.ts
      - name: Check canonical weekly review
        run: deno check --node-modules-dir=auto base44/functions/runCanonicalWeeklyDecisionReview/entry.ts
      - name: Check SKU and campaign isolated decision engines
        run: |
          deno check --node-modules-dir=auto \
            base44/shared/skuCampaignScope.ts \
            base44/shared/campaignMetricsIntegrity.ts \
            base44/functions/runEconomicBudgetBalancer/entry.ts \
            base44/functions/reconcileCampaignDeliveryHealth/entry.ts \
            base44/functions/runCanonicalCampaignLifecycleLayer/entry.ts \
            base44/shared/optimizationDecisionIdempotency.ts \
            base44/functions/runEconomicCurveAdsGuard/entry.ts \
            base44/functions/runAsinPeakProfileLearning/entry.ts \
            base44/functions/promoteWinningSearchTerms/entry.ts \
            base44/functions/negateKeywordInAutoCampaign/entry.ts
      - name: Check canonical economy-first dayparting
        run: |
          deno check --node-modules-dir=auto \
            base44/functions/runCanonicalDaypartingEngine/entry.ts \
            base44/functions/runWeekendHolidayDaypartLearning/entry.ts \
            base44/functions/syncDaypartingConfiguration/entry.ts
      - name: Check managed SP-API authentication gateway
        run: |
          deno check --node-modules-dir=auto \
            base44/shared/spApiLwa.ts \
            base44/functions/amazonApiGatewayCore/entry.ts
      - name: Check existing decision modules
        run: |
          deno check --node-modules-dir=auto \
            base44/shared/portfolioBudgetMath.ts \
            base44/shared/portfolioBudgetActions.ts \
            base44/shared/portfolioBudgetPacing.ts \
            base44/shared/campaignMetricsIntegrity.ts \
            base44/shared/amazonBidCeiling.ts \
            base44/shared/configuredBidPolicy.ts \
            base44/shared/winnerBidPolicy.ts \
            base44/shared/servingCampaignGrowthPolicy.ts \
            base44/functions/runServingCampaignGrowthObjective/entry.ts \
            server/src/scheduler.ts
      - name: Check sales mode modules
        run: |
          deno check --node-modules-dir=auto \
            base44/functions/smartBidFromCpc/entry.ts \
            base44/functions/runSalesModeWasteRotation/entry.ts \
            base44/functions/runSalesMode/entry.ts
          deno test --node-modules-dir=auto base44/shared/searchTermWastePolicy.test.ts
      - name: Test search term quality repository without database or Amazon access
        run: deno test --config server/tests/searchTermQuality/deno.json server/tests/searchTermQuality/repository.test.ts server/src/searchTermQualityContext.test.ts
      - name: Check search term quality and ingestion
        run: deno check --config server/deno.json base44/shared/searchTermQuality.ts server/src/sdk/entities.ts base44/functions/importSearchTermReport/entry.ts base44/functions/downloadAndProcessAmazonAdsReportJob/entry.ts
      - name: Test durable motor run outcome policy
        run: deno test --node-modules-dir=auto server/src/motorRunPolicy.test.ts
      - name: Test operational coverage and correlation without network
        run: deno test server/src/operationalState.test.ts
      - name: Test safe stale-decision and history handling without Amazon access
        run: deno test --config server/tests/canonicalIncident/deno.json server/tests/canonicalIncident/staleExecutor.test.ts server/tests/canonicalIncident/preserveHistory.test.ts
      - name: Test current and historical motor read models without network
        run: deno test server/src/motorDashboardPolicy.test.ts server/src/motorDashboardProxy.test.ts
      - name: Test full stock guard evidence and safe simulation without network
        run: deno test --config server/tests/stockGuard/deno.json server/tests/stockGuard/paging.test.ts
      - name: Test canonical campaign audit incident without external access
        run: deno test --config server/tests/canonicalIncident/deno.json --allow-env=MOTOR_STAGE_TIMEOUT_MS server/tests/canonicalIncident/incident.test.ts
      - name: Test scheduler and Hostinger OpenAI routing
        run: deno test --allow-read=base44/schedules/amazon-automation-schedule.json --node-modules-dir=auto server/src/scheduler.test.ts server/src/sdk/integrations.test.ts
      - name: Type-check Hostinger scheduler and health route
        run: deno check --node-modules-dir=auto server/src/scheduler.ts server/src/main.ts
      - name: Test environment status secret redaction
        run: deno test server/src/environmentStatus.test.ts

  reliability-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: livingfinds_test
          POSTGRES_PASSWORD: livingfinds_test
          POSTGRES_DB: livingfinds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U livingfinds_test -d livingfinds_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://livingfinds_test:livingfinds_test@localhost:5432/livingfinds_test
      LIVINGFINDS_TEST_DATABASE_URL: postgres://livingfinds_test:livingfinds_test@localhost:5432/livingfinds_test
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run durable decision and executor integration tests against isolated PostgreSQL
        run: >-
          deno test --allow-env
          --allow-net=localhost,127.0.0.1 --allow-read=server/migrations
          --node-modules-dir=auto server/src/reliability.postgres.test.ts
          server/src/migrations.postgres.test.ts
          server/src/motorDashboard.postgres.test.ts

  agents-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Agents SDK dependencies
        run: npm ci --prefix agents
      - name: Test engineer agent safety boundaries
        run: npm test --prefix agents
