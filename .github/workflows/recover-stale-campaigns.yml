name: Recuperar campanhas sem entrega

on:
  workflow_run:
    workflows: ["Deploy para VPS"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: recover-stale-campaigns
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Preparar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          test -n "${{ secrets.VPS_HOST }}"

      - name: Executar recuperação canônica e estímulo de vendas na VPS
        env:
          SSHOPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3 4 5; do
            echo "Tentativa SSH ${attempt}/5"
            if ssh $SSHOPTS "$TARGET" "bash -s" <<EOF
              set -euo pipefail
              cd "$VPS_PATH"

              ready=0
              for health_attempt in \$(seq 1 30); do
                if curl -sf http://127.0.0.1:8000/health >/dev/null; then
                  ready=1
                  break
                fi
                sleep 2
              done
              if [ "\$ready" -ne 1 ]; then
                echo "Backend não ficou saudável para a recuperação"
                exit 1
              fi

              docker compose -f server/docker-compose.yml exec -T app deno eval '
                const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
                const call = async (name, payload) => {
                  const response = await fetch("http://127.0.0.1:8000/functions/" + name, {
                    method: "POST",
                    headers: { "content-type": "application/json", "x-api-token": token },
                    body: JSON.stringify(payload),
                  });
                  const data = await response.json().catch(() => ({}));
                  console.log(name.toUpperCase() + "_HTTP=" + response.status + "|OK=" + data.ok + "|ENGINE=" + String(data.engine || "") + "|DATA=" + JSON.stringify(data).slice(0, 20000));
                  if (!response.ok || data.ok === false) throw new Error(data.error || ("Falha em " + name));
                  return data;
                };

                const common = {
                  _service_role: true,
                  _canonical_orchestrator: "runUnifiedDecisionEngine",
                  dry_run: false,
                };

                const health = await call("reconcileCampaignDeliveryHealth", {
                  ...common,
                  force: true,
                  trigger_type: "post_deploy_stale_zero_delivery_recovery",
                });
                const healthEngine = String(health.engine || "");
                if (!healthEngine.startsWith("campaign-delivery-health-v2.3-canonical-stock")) {
                  throw new Error("Versão antiga da recuperação ainda carregada na VPS: " + (healthEngine || "desconhecida"));
                }

                const recovery = await call("runIntradaySalesRecovery", {
                  ...common,
                  trigger_type: "post_deploy_intraday_sales_recovery",
                });
                if (String(recovery.engine || "") !== "INTRADAY_SALES_RECOVERY_V1") {
                  throw new Error("Versão de sales recovery não carregada na VPS: " + String(recovery.engine || "desconhecida"));
                }

                const executor = await call("executeApprovedDecisionQueue", {
                  _service_role: true,
                  max_decisions: 25,
                  trigger_type: "post_deploy_sales_recovery_executor",
                });

                await new Promise((resolve) => setTimeout(resolve, 5000));
                const confirmation = await call("confirmExecutedDecisions", {
                  _service_role: true,
                  trigger_type: "post_deploy_sales_recovery_confirmation",
                });

                console.log("POST_DEPLOY_SALES_RECOVERY_SUMMARY=" + JSON.stringify({
                  delivery_health_engine: healthEngine,
                  cancelled_false_stock_decisions: health?.results?.reduce((sum, row) => sum + Number(row.cancelled_false_stock_decisions || 0), 0) || 0,
                  stock_verifications: health?.results?.reduce((sum, row) => sum + (row.actions || []).filter((a) => a.action === "VERIFY_STOCK").length, 0) || 0,
                  recovery_active: recovery?.reports?.[0]?.recovery_active ?? null,
                  growth_allowed: recovery?.reports?.[0]?.growth_allowed ?? null,
                  queued: recovery?.reports?.[0]?.queued?.length ?? 0,
                  executor_executed: executor?.executed ?? null,
                  confirmation,
                }).slice(0, 20000));
              ' </dev/null
          EOF
            then
              success=1
              break
            fi
            sleep $((attempt * 15))
          done

          if [ "$success" -ne 1 ]; then
            echo "Falha após 5 tentativas de conexão/execução na VPS"
            exit 1
          fi
