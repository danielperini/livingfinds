name: Recuperar campanhas sem entrega

on:
  workflow_run:
    workflows: ["Deploy para VPS"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: recover-stale-campaigns
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Preparar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          test -n "${{ secrets.VPS_HOST }}"

      - name: Executar recuperação canônica na VPS
        env:
          SSHOPTS: -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3 4 5; do
            echo "Tentativa SSH ${attempt}/5"
            if ssh $SSHOPTS "$TARGET" "bash -s" <<EOF
              set -euo pipefail
              cd "$VPS_PATH"

              ready=0
              for health_attempt in \$(seq 1 30); do
                if curl -sf http://127.0.0.1:8000/health >/dev/null; then
                  ready=1
                  break
                fi
                sleep 2
              done
              if [ "\$ready" -ne 1 ]; then
                echo "Backend não ficou saudável para a recuperação"
                exit 1
              fi

              docker compose -f server/docker-compose.yml exec -T app deno eval '
                const token = Deno.env.get("API_TOKEN") || Deno.env.get("ADMIN_PASSWORD") || "";
                const response = await fetch("http://127.0.0.1:8000/functions/reconcileCampaignDeliveryHealth", {
                  method: "POST",
                  headers: { "content-type": "application/json", "x-api-token": token },
                  body: JSON.stringify({
                    _service_role: true,
                    _canonical_orchestrator: "runUnifiedDecisionEngine",
                    dry_run: false,
                    force: true,
                    trigger_type: "post_deploy_stale_zero_delivery_recovery"
                  })
                });
                const data = await response.json().catch(() => ({}));
                const engine = String(data.engine || "");
                console.log("RECOVERY_HTTP=" + response.status + "|OK=" + data.ok + "|ENGINE=" + engine + "|DATA=" + JSON.stringify(data).slice(0, 20000));
                if (!engine.startsWith("campaign-delivery-health-v2.2")) {
                  throw new Error("Versão antiga da recuperação ainda carregada na VPS: " + (engine || "desconhecida"));
                }
                if (!response.ok || data.ok === false) {
                  throw new Error(data.error || "Falha na recuperação imediata de campanhas");
                }
              ' </dev/null
          EOF
            then
              success=1
              break
            fi
            sleep $((attempt * 15))
          done

          if [ "$success" -ne 1 ]; then
            echo "Falha após 5 tentativas de conexão/execução na VPS"
            exit 1
          fi
