name: Apply economy-first dayparting patch

on:
  push:
    branches: [fix-dayparting-economy]
    paths:
      - 'scripts/apply_dayparting_economy_first_patch.py'
      - '.github/workflows/apply-daypart-economy-first.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[daypart-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-dayparting-economy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_dayparting_economy_first_patch.py
      - name: Validate patch markers
        run: |
          grep -q "canonical-dayparting-v4-economy-first" base44/functions/runCanonicalDaypartingEngine/entry.ts
          grep -q "isDayAggregatePattern" base44/functions/runCanonicalDaypartingEngine/entry.ts
          grep -q "const CANONICAL_RULES = \[\];" base44/functions/syncDaypartingConfiguration/entry.ts
          grep -q "fetchBrazilHolidays" base44/functions/runWeekendHolidayDaypartLearning/entry.ts
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base44/functions/runCanonicalDaypartingEngine/entry.ts \
                  base44/functions/syncDaypartingConfiguration/entry.ts \
                  base44/functions/runWeekendHolidayDaypartLearning/entry.ts
          if git diff --cached --quiet; then
            echo "No source changes required"
          else
            git commit -m "fix: canonical economy-first dayparting [daypart-patched]"
            git push origin HEAD:fix-dayparting-economy
          fi
