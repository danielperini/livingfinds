name: Apply Sales Growth Calibration
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-sales-growth-data-20260825.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply patch
        run: python3 scripts/apply-sales-growth-data-20260825.py
      - name: Validate Deno
        run: |
          deno check base44/functions/runUnifiedDecisionEngine/entry.ts
          deno check base44/functions/runServingCampaignGrowthObjective/entry.ts
          deno test base44/shared/searchTermHarvestPolicy.test.ts base44/shared/servingCampaignGrowthPolicy.test.ts
      - name: Build frontend
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add base44/functions/runUnifiedDecisionEngine/entry.ts base44/functions/runServingCampaignGrowthObjective/entry.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: accelerate proven winners and exact term harvest"
          git push origin HEAD:main
